# ===== Accelerate config =====
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
mixed_precision: 'bf16'
downcast_bf16: 'no'

# Số process phải KHỚP số GPU đang chạy (ví dụ 2 GPU => 2)
num_machines: 1
num_processes: 2           # <— đổi cho khớp cụm của bạn (2 nếu GPU_IDS=0,1)
machine_rank: 0
same_network: true
rdzv_backend: static

# GPU
use_cpu: false
gpu_ids: all               # hoặc liệt kê cụ thể: "0,1"

# Entry
main_training_function: main
debug: false

# DDP kwargs (rất quan trọng cho LoRA)
kwargs_handlers:
  - DistributedDataParallelKwargs:
      find_unused_parameters: false
      static_graph: true

# TPU (không dùng)
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
